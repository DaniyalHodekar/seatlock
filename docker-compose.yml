volumes:
  seatlock_postgres_vol:

services:
  db:
    image: postgres:17
    ports:
      - '5433:5432'
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - seatlock_postgres_vol:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'
