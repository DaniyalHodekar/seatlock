name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: seatlock_user
          POSTGRES_PASSWORD: seatlock_123
          POSTGRES_DB: seatlock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatlock_user -d seatlock_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://seatlock_user:seatlock_123@localhost:5432/seatlock_test
        run: pnpm --filter api test:e2e

      - name: Test Coverage
        run: pnpm --filter api test:cov
